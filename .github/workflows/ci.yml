name: CI

on:
  pull_request:
  push:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y fish
      # The runner's preinstalled ShellCheck is older than the Homebrew release used locally and disagrees with it.
      - name: Install current ShellCheck
        run: |
          /home/linuxbrew/.linuxbrew/bin/brew install shellcheck
          echo /home/linuxbrew/.linuxbrew/bin >>"$GITHUB_PATH"
      - run: curl -fsSL -o "$HOME/.shellcheckrc" https://raw.githubusercontent.com/tylerlaprade/dotfiles/master/.shellcheckrc
      - run: shellcheck --shell=bash fableplan.sh
      - run: shellcheck tests/bin/claude tests/run.sh tests/fableplan.bats
      - run: fish --no-execute fableplan.fish
      - run: fish --no-execute tests/run.fish
      - run: |
          for file in fableplan.fish tests/run.fish; do
            fish_indent "$file" | diff -u "$file" -
          done

  test:
    strategy:
      fail-fast: false
      matrix:
        shell:
          - bash
          - zsh
          - fish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: bats-core/bats-action@3.0.0
      - run: sudo apt-get update && sudo apt-get install -y zsh fish
      - run: bats tests
        env:
          FABLEPLAN_SHELL: ${{ matrix.shell }}
